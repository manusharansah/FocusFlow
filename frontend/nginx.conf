# Serves the SPA and reverse-proxies the API on the SAME origin, so the HttpOnly
# refresh cookie is first-party and CORS is not needed. TLS terminates in front of
# this container (load balancer / Caddy / Cloudflare) and sets X-Forwarded-Proto.
map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; '' $scheme; }

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 1m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Only these paths reach Django. allauth's HTML account pages are deliberately NOT exposed.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite (not append) so clients cannot spoof their IP when nginx is the edge hop;
    # if a CDN/LB is in front, set NUM_PROXIES in the API accordingly.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    include /etc/nginx/security-headers.conf;
  }
  location ~ ^/accounts/(google|3rdparty)/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    include /etc/nginx/security-headers.conf;
  }
  location /static/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    include /etc/nginx/security-headers.conf;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
    try_files $uri /index.html;
  }
}
