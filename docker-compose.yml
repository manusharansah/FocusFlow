# Production-like stack: docker compose up --build
# Put a TLS terminator (Caddy, Traefik, cloud LB) in front of `web` and set X-Forwarded-Proto.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: focusflow
      POSTGRES_USER: focusflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://focusflow:${POSTGRES_PASSWORD}@db:5432/focusflow
    depends_on: [db]
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    restart: unless-stopped
  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  pgdata:
